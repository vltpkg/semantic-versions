# Cloudflare Pages configuration for the semver.xyz static site.
#
# This is a *Pages* project, so deploy with `wrangler pages deploy`, not
# `wrangler deploy` (that is the Workers command and fails here with
# "Missing entry-point to Worker script or to assets directory").
#
#   vlt run deploy           build, then publish site/dist to production
#   vlt run deploy:preview   build, then publish a preview deployment
#
# CI does the same on every push to main (.github/workflows/deploy.yml).
name = "semver-xyz"
compatibility_date = "2026-08-12"
pages_build_output_dir = "site/dist"

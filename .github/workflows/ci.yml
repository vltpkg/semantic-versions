name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install vlt
        run: |
          curl -fsSL https://install.vlt.sh | bash
          vlt --version

      - name: Install dependencies
        run: vlt install --frozen-lockfile

      - name: Run parser tests
        run: vlt run test -w packages/parser

      - name: Build site
        run: vlt run build -w site
